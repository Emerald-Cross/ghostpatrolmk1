<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ghost Patrol Targets</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/print.css?v=haunt-20261026-1">
</head>
<body>
  <nav aria-label="Printable targets">
    <a href="/">← Session chooser</a>
    <a href="?kind=ghosts">15 physical ghosts</a>
    <a href="?kind=badges">6 chest badges</a>
    <a href="?kind=test">Wand test</a>
    <button onclick="print()">Print selected targets</button>
    <span>Letter paper · 100% scale · one sided</span>
  </nav>
  <main id="sheets"></main>
  <script type="module">
    import { icon } from '/icons.js?v=haunt-20261026-1';
    const kind = new URLSearchParams(location.search).get('kind') || 'test';
    const colors = ['Black','White','Blue','Red','Yellow','Green'];
    const targets = kind === 'ghosts'
      ? Array.from({length:15},(_,i)=>({ title:'Ghost '+(i+1), file:'ghost-'+(i+1), ghost:i%3, note:'100 points · One capture per hunter' }))
      : kind === 'badges'
        ? colors.map(color=>({ title:color, file:'player-'+color.toLowerCase(), badge:color.toLowerCase() }))
        : [{ title:'Wand check', file:'test', note:'Scan here to test your scanner blaster' }];
    document.getElementById('sheets').innerHTML = targets.map(t=>`
      <section class="sheet ${t.badge ? 'badge '+t.badge : ''}">
        <header class="target-header">
          ${t.ghost !== undefined ? `<span class="ghost-sprite ghost-${t.ghost}" aria-hidden="true"></span>` : `<span class="print-mark" aria-hidden="true">${icon(t.badge ? 'ghost' : 'blaster')}</span>`}
          <h1>${t.title}</h1>
        </header>
        <div class="print-code"><img class="qr" src="/qr/${t.file}.svg" alt="${t.title} QR code" width="700" height="700"></div>
        ${t.note ? '<p>'+t.note+'</p>' : '<div class="badge-stripe" aria-hidden="true"></div>'}
      </section>`).join('');
  </script>
</body>
</html>
